[workspace]
resolver = "2"
members = [
    "crates/quader-geom",
    "crates/quader-doc",
    "crates/quader-engine",
    "apps/quadernote-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["QuaderNote Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/quadernote/quadernote"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
